name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate release bundle
        run: node scripts/validate-release.mjs
      - name: Check generated plugin bundle
        run: |
          node scripts/sync-plugin.mjs
          git diff --exit-code
